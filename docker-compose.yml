version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: skillbridge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - skillbridge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/skillbridge
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - CLIENT_URL=http://localhost:3000
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - INDUSTRY_DATASET_PATH=/app/dataset/processed/role_skill_summary.json
    volumes:
      - resume_uploads:/app/uploads
      - ./dataset/processed:/app/dataset/processed:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillbridge-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: skillbridge-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skillbridge-network

volumes:
  mongodb_data:
    name: skillbridge_mongodb_data
  resume_uploads:
    name: skillbridge_resume_uploads

networks:
  skillbridge-network:
    name: skillbridge-network
    driver: bridge
